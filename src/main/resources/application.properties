spring.application.name=spring-lab-01
spring.messages.fallback-to-system-locale=false
spring.datasource.url=jdbc:postgresql://localhost:5432/springlab?currentSchema=lab9
spring.datasource.username=springlab
spring.datasource.password=springlab
spring.flyway.default-schema=lab9
spring.flyway.schemas=lab9
spring.jpa.open-in-view=false
